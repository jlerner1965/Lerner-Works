<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>OG card source — not a page</title>
<!--
  Source for the Open Graph link-preview cards, rendered to PNG by render.js.
  One template, several cards: render.js opens this file with ?k=...&t=...
  and the tiny script below writes those into the card. That script runs
  only at render time in the dev browser — the published PNG is static and
  the site itself ships no JavaScript.

  Typographic only: the site's own navy, evergreen and faces. No stock art.
-->
<link rel="stylesheet" href="../site.css" />
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;}
  body{background:#14283F;color:#fff;font-family:var(--sans);position:relative;}
  .og{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;}
  .og p{margin:0;}
  .og__k{font-size:22px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#5FBF97;}
  .og__t{font-family:var(--serif);font-weight:600;font-size:66px;line-height:1.1;letter-spacing:-.015em;max-width:19ch;margin-top:26px;}
  .og__t.small{font-size:58px;}
  .og__b{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(255,255,255,.18);padding-top:28px;}
  .og__brand{font-family:var(--serif);font-weight:700;font-size:34px;letter-spacing:-.015em;}
  .og__brand small{display:block;font-family:var(--sans);font-size:18px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:6px;}
  .og__url{font-size:22px;color:rgba(255,255,255,.55);}
  .og__bar{position:absolute;left:0;top:0;width:100%;height:10px;background:#1D6B52;}
</style>
</head>
<body>
<div class="og__bar"></div>
<div class="og">
  <div>
    <p class="og__k" id="k">Web design &amp; marketing · Boulder County</p>
    <p class="og__t" id="t">A website that brings in work. Built by the person you actually talk to.</p>
  </div>
  <div class="og__b">
    <p class="og__brand">Lerner Works<small>James Lerner · Niwot, Colorado</small></p>
    <p class="og__url">lernerworks.com</p>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('k')) document.getElementById('k').textContent = q.get('k');
  if (q.get('t')) { const t = document.getElementById('t'); t.textContent = q.get('t'); if (q.get('t').length > 70) t.classList.add('small'); }
</script>
</body>
</html>
