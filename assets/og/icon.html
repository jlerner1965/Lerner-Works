<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Touch icon source — not a page</title>
<!--
  Source for /apple-touch-icon.png, rendered to a 180×180 PNG by render.js.
  The same mark as the favicon every page declares in its <head> — "LW" in
  evergreen on navy — set in the site's own serif rather than Georgia, which
  the dev browser does not have. Full-bleed and opaque: iOS rounds the
  corners itself and fills any transparency with black.
-->
<link rel="stylesheet" href="../site.css" />
<style>
  html,body{margin:0;width:180px;height:180px;overflow:hidden;}
  body{background:#14283F;display:flex;align-items:center;justify-content:center;}
  .mark{font-family:var(--serif);font-weight:700;font-size:92px;line-height:1;letter-spacing:-.02em;color:#5FBF97;margin-top:-6px;}
</style>
</head>
<body>
<p class="mark">LW</p>
</body>
</html>
