<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Touch icon source — not a page</title>
<!--
  Source for /apple-touch-icon.png, rendered to a 180×180 PNG by render.js.
  The same mark as the favicon every page declares in its <head> and the nav
  carries beside the name: the "LW." monogram from assets/brand/lw-mark.svg,
  navy with its green square, on white, as the supplied logo has it.
  Full-bleed and opaque: iOS rounds the corners itself and fills any
  transparency with black.
-->
<style>
  html,body{margin:0;width:180px;height:180px;overflow:hidden;}
  body{background:#fff;display:flex;align-items:center;justify-content:center;}
  img{width:136px;height:auto;display:block;}
</style>
</head>
<body>
<img src="../brand/lw-mark.svg" width="893" height="450" alt="" />
</body>
</html>
