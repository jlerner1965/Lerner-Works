<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>OG card source — home</title>

<!--
  SOURCE FOR assets/og/home.png — not a page of the site.

  Render at exactly 1200 x 630, scale 1. From the repo root, with a
  server running on :8765 and Playwright available:

    node assets/og/render.js

  Everything here is the site's own type, colour and copy — the headline
  is the home page h1 verbatim. If you change that h1, change it here and
  re-render, or the social preview starts telling a different story than
  the page.
-->

<style>
  @font-face{
    font-family:"Public Sans";font-style:normal;font-weight:400 600;
    src:url(../fonts/public-sans-latin.woff2) format("woff2");
  }
  @font-face{
    font-family:"Source Serif 4";font-style:normal;font-weight:400 700;
    src:url(../fonts/source-serif-4-latin.woff2) format("woff2");
  }

  :root{
    --navy:#14283F; --ever:#1D6B52; --ever-light:#5FBF97;
    --serif:"Source Serif 4",Georgia,serif;
    --sans:"Public Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;}
  html,body{width:1200px;height:630px;}
  body{
    background:var(--navy);color:#fff;font-family:var(--sans);
    padding:74px 80px;display:flex;flex-direction:column;
    justify-content:space-between;position:relative;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* Same green accent the site uses to mark a section, at card scale. */
  .rule{position:absolute;left:0;top:0;width:10px;height:100%;background:var(--ever);}

  .top{display:flex;align-items:center;gap:18px;}
  .mark{
    width:54px;height:54px;border-radius:9px;background:#fff;
    display:grid;place-items:center;font-family:var(--serif);
    font-weight:700;font-size:27px;color:var(--navy);letter-spacing:-.02em;
  }
  .name{font-family:var(--serif);font-weight:700;font-size:31px;letter-spacing:-.015em;}
  .name small{
    display:block;font-family:var(--sans);font-size:14px;font-weight:500;
    letter-spacing:.13em;text-transform:uppercase;color:#9FB0BF;margin-top:3px;
  }

  /* Wide measure on purpose: this is a 1200px card seen at thumbnail size,
     not a column of body copy. Three lines using the full width read far
     better in a feed than five narrow ones. */
  h1{
    font-family:var(--serif);font-weight:600;font-size:60px;line-height:1.15;
    letter-spacing:-.014em;max-width:33ch;
  }
  h1 span{color:var(--ever-light);}

  .foot{
    display:flex;align-items:center;gap:14px;font-size:19px;color:#B4C2CE;
    border-top:1px solid rgba(245,247,248,.2);padding-top:22px;
  }
  .dot{width:5px;height:5px;border-radius:50%;background:var(--ever-light);flex:0 0 auto;}
</style>
</head>
<body>
  <div class="rule"></div>

  <div class="top">
    <div class="mark">LW</div>
    <div class="name">Lerner Works<small>James Lerner · Boulder County</small></div>
  </div>

  <h1>Your website should be your best salesperson. <span>Most are a brochure nobody reads.</span></h1>

  <div class="foot">
    <span class="dot"></span>
    <span>Web design &amp; marketing · Niwot, Colorado</span>
  </div>
</body>
</html>
